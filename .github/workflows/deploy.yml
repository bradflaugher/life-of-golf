name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://lifeofgolf.win
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run unit tests before deploy
        run: node --test tests/*.test.mjs

      - name: Stage public files
        run: |
          VERSION="${GITHUB_SHA:0:8}"
          mkdir -p _site
          cp index.html favicon.svg site.webmanifest _headers _site/
          cp -r src models vendor _site/
          sed -i -E "s|(href=\"\./src/style\.css)\"|\1?v=${VERSION}\"|g; s|(src=\"\./src/main\.js)\"|\1?v=${VERSION}\"|g" _site/index.html
          sed -i -E "s|(from '\./[^']+\.js)'|\1?v=${VERSION}'|g" _site/src/*.js
          sed -i -E "s|('\./models/caddie_net\.json)'|\1?v=${VERSION}'|g" _site/src/main.js _site/src/caddie.js
          test -f _site/index.html
          test -f _site/_headers
          test -f _site/models/caddie_net.json
          test -f _site/vendor/three/three.module.min.js

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          command: pages deploy _site --project-name=life-of-golf --branch=main
